name: Website (installable app)

# Publishes the game to GitHub Pages, so it can be played in any browser and
# installed on Android phones as an app (PWA):
#   https://<owner>.github.io/<repo>/
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Collect the website files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js fonts icons _site/
          touch _site/.nojekyll
          # A new cache name for every version, so installed apps swap to it in one go.
          sed -i "s/monkey-coder-v1/monkey-coder-${GITHUB_SHA::8}/" _site/sw.js
          grep -q "monkey-coder-${GITHUB_SHA::8}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
